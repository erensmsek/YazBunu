# YazBunu paketleme yapılandırması (electron-builder).
# Native modüller ve ffmpeg kurulumda o platform için indirilir → her platform kendi işletim
# sisteminde derlenir: npm run dist:mac | dist:win | dist:linux (bkz. docs/BUILD.md).
appId: com.erensmsek.yazbunu
productName: YazBunu
copyright: Copyright © 2026 Eren Şimşek
directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!**/*.map"
  - "!**/*.{md,markdown,d.ts,ts.map}"
  - "!**/{test,tests,__tests__,example,examples,docs}/**"
  # transformers.js Node sürümü web çalışma zamanını kullanmaz.
  - "!node_modules/onnxruntime-web/**"
  # onnxruntime-node tüm platformların ikililerini içerir: her platform bölümü diğerlerini hariç
  # tutar. Not: ${platform} makrosu çapraz derlemede derleyen makineye çözüldüğü için kullanılmıyor.
  # Platform bölümlerindeki files listesi yalnızca hariç tutma içerirse electron-builder "her şeyi"
  # dahil eder — bu yüzden orada da dist/** ve package.json tekrar yazılı.

# Native ikililer asar arşivinden çıkarılmalı (işletim sistemi arşiv içinden yükleyemez).
asarUnpack:
  - "node_modules/sherpa-onnx-*/**"
  - "node_modules/ffmpeg-static/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"

extraResources:
  - from: resources/models
    to: models
    filter: ["*.onnx", "ATTRIBUTION.md"]
  - from: LICENSE
    to: LICENSE.txt
  - from: build/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

mac:
  files:
    - dist/**
    - package.json
    - "!**/*.map"
    - "!node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}/**"
  category: public.app-category.productivity
  icon: resources/icons/icon-512.png
  target:
    - target: dmg
    - target: zip
  # Sertifika yoksa ad-hoc imza: Apple Silicon imzasız uygulamayı hiç çalıştırmaz.
  # Apple Developer ID alınınca burayı sertifika adıyla değiştir (ya da CSC_NAME ortam değişkeni).
  identity: "-"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "YazBunu, konuşmanı yazıya dökmek için mikrofonu kullanır."
    NSAudioCaptureUsageDescription: "YazBunu, bilgisayarda çalan sesi (toplantı, video) yazıya dökmek için sistem sesini kaydeder."
    LSApplicationCategoryType: public.app-category.productivity
dmg:
  title: "YazBunu ${version}"

win:
  files:
    - dist/**
    - package.json
    - "!**/*.map"
    - "!node_modules/onnxruntime-node/bin/napi-v*/{linux,darwin}/**"
    - "!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**"
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YazBunu
  artifactName: "YazBunu-Setup-${version}.${ext}"

linux:
  files:
    - dist/**
    - package.json
    - "!**/*.map"
    - "!node_modules/onnxruntime-node/bin/napi-v*/{win32,darwin}/**"
    - "!node_modules/onnxruntime-node/bin/napi-v*/linux/arm64/**"
  icon: resources/icons/icon-512.png
  category: AudioVideo
  synopsis: Konuşmayı yazıya döken, çeviren ve özetleyen ses asistanı
  maintainer: "Eren Şimşek <eren52simsek@gmail.com>"
  target:
    - target: AppImage
    - target: deb
  desktop:
    entry:
      StartupWMClass: YazBunu
appImage:
  artifactName: "YazBunu-${version}-${arch}.${ext}"
deb:
  # Sistem sesi kaydı için (PipeWire'da pipewire-pulse aynı komutu sağlar).
  recommends: ["pulseaudio-utils"]
  artifactName: "yazbunu_${version}_${arch}.${ext}"

publish:
  provider: github
  owner: erensmsek
  repo: YazBunu
  releaseType: draft
